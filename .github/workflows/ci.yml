# The second gate, and the authoritative one.
#
# The hook in .claude/hooks/build-gate.sh proves the tree builds on the
# machine that wrote it, with the compiler that machine happens to have, in a
# working directory that has been accumulating state all afternoon. This
# proves it builds from a clean checkout, on Linux as well as macOS, and under
# gcc as well as clang — which is the only portability test this project has
# and the only way house rule 4's fifteen-year claim gets checked at all.
#
# Two front ends disagreeing about a program is almost always the program's
# fault. Finding out costs one file.
#
# What is deliberately not here: `cairn check`. It needs cairn installed,
# which means a toolchain and a download on every run, to validate files that
# the local gate already refused to let past. The dependency is not worth it.

name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux, gcc
            os: ubuntu-latest
            cxx: g++-14
          - name: macos, clang
            os: macos-latest
            cxx: clang++

    steps:
      - uses: actions/checkout@v5

      # The second claim, as a check rather than a boast. transport.hpp says
      # that soft shadows, ambient occlusion and the rest have no code — they
      # are what solving one integral honestly looks like. The pattern lives
      # here, outside the tree it searches, because a file that has to be free
      # of a word cannot contain the grep for it.
      - name: None of them has any code
        if: runner.os == 'Linux'
        run: |
          if grep -rniE 'soft_shadow|ambient_occlusion|fake' include/ apps/; then
            echo "::error::transport.hpp claims none of these has any code."
            exit 1
          fi
          echo "Nothing found, which is the claim."

      - name: Install gcc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-14

      - name: The compiler
        run: ${{ matrix.cxx }} --version

      - name: Build, run, and build again with every warning fatal
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -eu
          # Before apps/main.cpp exists there is nothing to link, and make
          # says so at some length. The same question the commit gate asks.
          if ! ls apps/*.cpp >/dev/null 2>&1; then
            echo "No apps/*.cpp yet: there is nothing to link."
            exit 0
          fi

          make CXX="$CXX"
          ./cornell
          ./cornell render 120 --spp 4

          # The inspection sheet. It exits non-zero if any claim fails, so a
          # BVH that starts disagreeing with an exhaustive search cannot be
          # merged — which is the whole point of writing the check down.
          #
          # Run once and let it fail the step. The first version of this was
          # wrapped in `if ./cornell verify >/dev/null || [ $? -ne 127 ]`,
          # which was meant to skip the check on a build that did not have it
          # yet. An unknown subcommand exits 1 from the usage path and never
          # 127, so the condition was always true, verify ran twice, and the
          # build only failed because `set -e` caught the second run.
          ./cornell verify

          # `make strict` arrives with the Makefile item; until then there is
          # no target to call.
          if grep -q '^strict:' Makefile; then
            make clean
            make CXX="$CXX" strict
          fi
